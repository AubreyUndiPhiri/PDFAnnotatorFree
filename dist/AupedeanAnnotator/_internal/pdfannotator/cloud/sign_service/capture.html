<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="referrer" content="no-referrer">
<title>Draw your signature</title>
<style>
  :root { --ink:#1b2236; --muted:#5d6781; --accent:#4f46e5; --bad:#dc2626; --ok:#15803d; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--ink);
         background: linear-gradient(135deg, #c5d3ff, #e6d9ff 45%, #c3ede2); min-height: 100vh; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 12px 40px; }
  .card { background: rgba(255,255,255,.94); border: 1px solid #fff; border-radius: 18px; padding: 16px 18px;
          box-shadow: 0 8px 28px rgba(90,78,175,.18); margin-bottom: 14px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .muted { color: var(--muted); font-size: 14px; }
  canvas.pad { width: 100%; height: 220px; border: 1px solid #c5cde0; border-radius: 12px; background: #fff;
               touch-action: none; display: block; margin-top: 12px; }
  .hint { text-align: center; color: #a3abc0; font-size: 13px; margin-top: 6px; }
  .row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; align-items: center; justify-content: flex-end; }
  button { font: inherit; font-size: 16px; padding: 12px 22px; border-radius: 999px; border: 1px solid #c5cde0;
           background: #fff; cursor: pointer; }
  button.primary { background: linear-gradient(#8d86f8, #5a51ea); color: #fff; border-color: #3c34c4; font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }
  .error { color: var(--bad); font-weight: 600; font-size: 14px; margin-top: 8px; }
  .done { color: var(--ok); font-weight: 700; font-size: 18px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1 id="title">Draw your signature</h1>
    <div class="muted" id="sub">Sign in the box with your finger or a stylus. It goes straight to AUPedean Annotator on your computer.</div>
    <div class="error" id="error"></div>
  </div>
  <div class="card" id="padCard">
    <canvas class="pad" id="pad"></canvas>
    <div class="hint">Sign above. Turn your phone sideways for more room.</div>
    <div class="row"><button type="button" id="clearBtn">Clear</button>
      <button type="button" class="primary" id="sendBtn">Send to my computer</button></div>
  </div>
  <div class="card hidden" id="doneCard">
    <div class="done">Sent. Thank you!</div>
    <p class="muted">Your signature is now in AUPedean Annotator on your computer. You can close this page.</p>
  </div>
</div>
<script>
(function () {
  function $(id) { return document.getElementById(id); }
  var ID = location.pathname.split('/').pop();
  var hash = new URLSearchParams(location.hash.slice(1));
  var KEY = hash.get('k') || '';
  var TEST = hash.get('test');          // automated tests only
  var ERRORS = {
    'not-found': 'This link is not valid. Ask for a new one from AUPedean Annotator.',
    'expired': 'This link has expired. Ask for a new one from AUPedean Annotator.',
    'already-signed': 'A signature was already sent with this link.',
    'cancelled': 'This request was cancelled in AUPedean Annotator.',
    'server': 'Something went wrong. Try again in a minute.'
  };
  function explain(err) { return ERRORS[err.error] || err.detail || ('Something went wrong (' + (err.error || err) + ').'); }
  async function api(path, opts) {
    opts = opts || {};
    var resp = await fetch('/api/m/' + ID + path, {method: opts.method || 'GET', headers: opts.headers || {}, body: opts.body});
    var data = (resp.headers.get('content-type') || '').indexOf('json') >= 0 ? await resp.json() : {error: 'server'};
    if (!resp.ok) throw data;
    return data;
  }
  function stop(text) { $('error').textContent = text; $('padCard').classList.add('hidden'); }

  // AES-GCM with the key from the link (#k=...); 12-byte IV in front, like AUPedean expects
  function b64ToBytes(b64) { var s = atob(b64), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }
  function bytesToB64(bytes) { var s = ''; for (var i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); }
  async function encrypt(bytes) {
    var raw = b64ToBytes(KEY.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - KEY.length % 4) % 4));
    var key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt']);
    var iv = crypto.getRandomValues(new Uint8Array(12));
    var ct = new Uint8Array(await crypto.subtle.encrypt({name: 'AES-GCM', iv: iv}, key, bytes));
    var out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12); return out;
  }

  var pad = $('pad'), ctx = pad.getContext('2d'), drawn = false, last = null, lastMid = null;
  function sizePad() {
    var r = pad.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    pad.width = Math.max(1, Math.round(r.width * dpr)); pad.height = Math.max(1, Math.round(r.height * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111827';
    drawn = false;
  }
  function pt(e) { var r = pad.getBoundingClientRect(); return {x: e.clientX - r.left, y: e.clientY - r.top, p: e.pressure || 0.5}; }
  pad.addEventListener('pointerdown', function (e) { pad.setPointerCapture(e.pointerId); last = pt(e); lastMid = last; });
  pad.addEventListener('pointermove', function (e) {
    if (!last) return;
    var p = pt(e), mid = {x: (last.x + p.x) / 2, y: (last.y + p.y) / 2};
    ctx.lineWidth = 1.8 + 2.2 * (e.pointerType === 'pen' ? p.p : 0.6);
    ctx.beginPath(); ctx.moveTo(lastMid.x, lastMid.y); ctx.quadraticCurveTo(last.x, last.y, mid.x, mid.y); ctx.stroke();
    last = p; lastMid = mid; drawn = true; $('error').textContent = '';
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (t) { pad.addEventListener(t, function () { last = null; }); });
  $('clearBtn').onclick = function () { ctx.clearRect(0, 0, pad.width, pad.height); drawn = false; };
  window.addEventListener('resize', function () { if (!drawn) sizePad(); });

  function trimmed() {
    var w = pad.width, h = pad.height, px = ctx.getImageData(0, 0, w, h).data, x0 = w, y0 = h, x1 = -1, y1 = -1;
    for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) if (px[(y * w + x) * 4 + 3] > 10) {
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
    }
    if (x1 < 0) return null;
    var m = 6; x0 = Math.max(0, x0 - m); y0 = Math.max(0, y0 - m); x1 = Math.min(w - 1, x1 + m); y1 = Math.min(h - 1, y1 + m);
    var out = document.createElement('canvas'); out.width = x1 - x0 + 1; out.height = y1 - y0 + 1;
    out.getContext('2d').drawImage(pad, x0, y0, out.width, out.height, 0, 0, out.width, out.height);
    return out.toDataURL('image/png');
  }

  $('sendBtn').onclick = async function () {
    var png = drawn ? trimmed() : null;
    if (!png) { $('error').textContent = 'Please draw your signature in the box.'; return; }
    $('sendBtn').disabled = true; $('sendBtn').textContent = 'Sending…';
    try {
      var result = {format: 'aupedean-signature/1', signature_png: png.split(',')[1], client_time: new Date().toISOString()};
      var sealed = await encrypt(new TextEncoder().encode(JSON.stringify(result)));
      await api('/sign', {method: 'POST', headers: {'content-type': 'text/plain'}, body: bytesToB64(sealed)});
      $('padCard').classList.add('hidden'); $('doneCard').classList.remove('hidden');
    } catch (e) { $('error').textContent = explain(e); $('sendBtn').disabled = false; $('sendBtn').textContent = 'Send to my computer'; }
  };

  async function start() {
    sizePad();
    if (!KEY) { stop('Open the whole link from the email (it ends with a long code).'); return; }
    try {
      var info = await api('/info');
      if (info.status !== 'waiting') { stop(ERRORS[info.status] || 'This link is no longer open.'); return; }
      if (TEST) autoSign();
    } catch (e) { stop(explain(e)); }
  }
  function autoSign() {   // automated tests only: draw a stroke and send it
    ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(20, 120); ctx.bezierCurveTo(80, 20, 140, 200, 220, 80); ctx.stroke();
    drawn = true;
    $('sendBtn').onclick().then(function () { var d = document.createElement('div'); d.id = 'selftest-done';
      d.textContent = $('doneCard').classList.contains('hidden') ? 'failed' : 'sent'; document.body.appendChild(d); });
  }
  start();
})();
</script>
</body>
</html>
