<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="AUPedean Annotator icon">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#3b7bff"/>
      <stop offset="100%" stop-color="#1d3fb8"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <!-- signing line -->
  <path d="M44 196H212" stroke="#ffffff" stroke-opacity="0.45" stroke-width="10" stroke-linecap="round"/>
  <!-- signature stroke (the app's signature mark) ending at the pen's nib -->
  <path d="M44 164c21-7 31.5-63 49-63 14 0-7 63 10.5 63 11.2 0 17.5-28 28-28 8.4 0 5.6 21 17.5 21 7 0 14-4.9 21-10.5"
        fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- pen, nib touching the end of the stroke -->
  <g transform="translate(170 146) rotate(-45)">
    <path d="M0 0L14 -9V9Z" fill="#0f1e4a"/>
    <rect x="13" y="-11" width="16" height="22" rx="3" fill="#e8edf8"/>
    <rect x="27" y="-11" width="62" height="22" rx="5" fill="#ffd43b"/>
    <rect x="80" y="-11" width="12" height="22" rx="5" fill="#0f1e4a"/>
  </g>
</svg>
